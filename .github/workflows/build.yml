name: build

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: gofmt -w ./cmd/bds-test-bot/main.go
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
